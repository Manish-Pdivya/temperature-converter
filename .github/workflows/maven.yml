
name: Temperature Converter Maven CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # JOB 1: Maven Build and Testing
  build:
    name: Maven Build and JUnit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test using Maven
        run: mvn clean verify

      - name: Display JUnit Test Results
        if: always()
        run: |
          echo "========== JUNIT TEST RESULTS =========="
          cat target/surefire-reports/*.txt || true

      - name: Upload JUnit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUnit-Test-Reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # JOB 2: Build and Push Docker Image
  docker:
    name: Build and Push to Docker Hub
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/temperature-converter:latest